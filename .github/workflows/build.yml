# 自动打包：Android（aarch64 / x86_64）、Windows x64（NSIS）、可选 Microsoft Store MSIX（x64）
#
# 触发：推 v* tag（打包并建 Release）或手动 dispatch（只出 artifact）
# 说明：Windows 端在没有 TAURI_SIGNING_PRIVATE_KEY 时自动关闭 updater 产物，产物可用但应用内更新不生效
#
# 需要配置的仓库 Secrets：
#   ANDROID_KEYSTORE_BASE64       安卓签名 keystore 的 base64（base64 -w0 your.jks）
#   ANDROID_KEYSTORE_PASSWORD     证书库密码
#   ANDROID_KEY_ALIAS             密钥别名
#   ANDROID_KEY_PASSWORD          密钥密码
#   TAURI_SIGNING_PRIVATE_KEY     可选，Tauri updater 私钥；不配则 Windows 产物不带 .sig
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  可选，私钥口令
#
# 需要配置的仓库 Variables：
#   VITE_APP_BASE_API / VITE_OSS_URL / VITE_OSS_THUMBNAIL_URL / VITE_OSS_1999_PREVIEW_URL
#   VITE_STORE_VERSION  可选，商店版本号
#
# 版本号从 packages/app_tauri/tauri.<platform>.conf.json 读取，tag 必须为 v<版本号>，否则 fail

name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_store:
        description: 额外出 Microsoft Store MSIX（x64）
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "12.15.0"

jobs:
  android:
    name: Android ${{ matrix.abi }}
    # 固定 24.04：ubuntu-latest 迁到 26.04 后默认 JDK 变 25，Gradle 8.14.3 不支持
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            rust_target: aarch64-linux-android
            abi: arm64-v8a
            script: build:app
          - target: x86_64
            rust_target: x86_64-linux-android
            abi: x86_64
            script: build:app:x86_64
    env:
      VITE_APP_BASE_API: ${{ vars.VITE_APP_BASE_API }}
      VITE_OSS_URL: ${{ vars.VITE_OSS_URL }}
      VITE_OSS_THUMBNAIL_URL: ${{ vars.VITE_OSS_THUMBNAIL_URL }}
      VITE_OSS_1999_PREVIEW_URL: ${{ vars.VITE_OSS_1999_PREVIEW_URL }}
      VITE_STORE_VERSION: ${{ vars.VITE_STORE_VERSION }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          # 缓存 pnpm store，避免每个 job 从零装依赖
          cache: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: android-${{ matrix.target }}
          cache-on-failure: true

      - name: 安装依赖
        # 锁文件含 packages/app_server（私有子模块）的 importer，CI 无法检出，frozen 校验必然失败
        run: pnpm install --no-frozen-lockfile

      - name: 生成前端环境变量
        run: node scripts/writeCiEnv.js android

      - name: 准备 Android SDK / NDK 环境
        run: |
          ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          NDK_DIR="${ANDROID_NDK_HOME:-}"
          if [ -z "$NDK_DIR" ]; then
            NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$NDK_DIR" ]; then
            echo "::error::未找到 Android NDK"
            exit 1
          fi
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "使用 NDK: $NDK_DIR"

      # gen/android 只入库了定制文件，gradlew/settings.gradle/buildSrc 由 init 补齐
      # init 是纯增量：已存在的文件不会被覆盖，所以入库的 build.gradle.kts 不会被冲掉
      - name: 补全安卓工程脚手架
        run: pnpm -F app_tauri tauri android init --ci --skip-targets-install

      - name: 写入安卓签名配置
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          android_dir="$GITHUB_WORKSPACE/packages/app_tauri/gen/android"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$android_dir/release.jks"
          # storeFile 必须是绝对路径，build.gradle.kts 里用 file() 相对 app 目录解析
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$android_dir/release.jks" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
            > "$android_dir/keystore.properties"

      # Gradle 每次都会重新下载发行包并重解析 AGP/Kotlin 依赖，缓存 ~/.gradle 能省下几分钟
      - name: 缓存 Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('packages/app_tauri/gen/android/gradle/wrapper/gradle-wrapper.properties', 'packages/app_tauri/gen/android/**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 构建 APK
        run: pnpm ${{ matrix.script }}

      - name: 归档产物
        run: |
          mkdir -p out
          # gradle 产出的文件名含中文和全角冒号，统一改成 ASCII，避免 artifact / release / CDN 环节出问题
          cp packages/app_tauri/target/android/*.apk "out/re1999-archive_${APP_VERSION}_${{ matrix.abi }}.apk"
          cd out
          md5sum "re1999-archive_${APP_VERSION}_${{ matrix.abi }}.apk" > "re1999-archive_${APP_VERSION}_${{ matrix.abi }}.apk.md5"
          ls -l

      - uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.abi }}
          path: out/*
          if-no-files-found: error

  windows:
    name: Windows x64 (NSIS)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VITE_APP_BASE_API: ${{ vars.VITE_APP_BASE_API }}
      VITE_OSS_URL: ${{ vars.VITE_OSS_URL }}
      VITE_OSS_THUMBNAIL_URL: ${{ vars.VITE_OSS_THUMBNAIL_URL }}
      VITE_OSS_1999_PREVIEW_URL: ${{ vars.VITE_OSS_1999_PREVIEW_URL }}
      VITE_STORE_VERSION: ${{ vars.VITE_STORE_VERSION }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          # 缓存 pnpm store，避免每个 job 从零装依赖
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: windows-x64
          cache-on-failure: true

      - name: 安装依赖
        # 锁文件含 packages/app_server（私有子模块）的 importer，CI 无法检出，frozen 校验必然失败
        run: pnpm install --no-frozen-lockfile

      - name: 生成前端环境变量
        run: node scripts/writeCiEnv.js windows

      - name: 构建安装包
        shell: pwsh
        run: |
          # createUpdaterArtifacts 为 true 时，缺少私钥会让 tauri build 在打包完成后报错终止
          $extra = @()
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Host "::warning::未配置 TAURI_SIGNING_PRIVATE_KEY，本次产物不含 updater 签名，应用内自动更新对本次安装包不生效"
            $extra = @("--config", '{"bundle":{"createUpdaterArtifacts":false}}')
          }
          # 只出 NSIS：targets=all 会拉 WiX，hosted runner 上 zh-CN 语言包偶发失败，且 updater 用的是 NSIS
          pnpm -F app_tauri tauri build --config tauri.windows.conf.json --bundles nsis @extra

      - name: 归档产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $exe = Get-ChildItem "target/release/bundle/nsis/*.exe" -ErrorAction Stop | Select-Object -First 1
          $name = "re1999-archive_${env:APP_VERSION}_x64-setup.exe"
          Copy-Item $exe.FullName "out/$name"
          $hash = (Get-FileHash "out/$name" -Algorithm MD5).Hash.ToLower()
          "$hash  $name" | Set-Content "out/$name.md5" -Encoding utf8
          # updater 签名：有私钥时 tauri 会生成 <安装包>.exe.sig，应用内更新校验的就是它，必须一起归档
          $sig = Get-ChildItem "target/release/bundle/nsis/*.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sig) {
            Copy-Item $sig.FullName "out/$name.sig"
            Write-Host "已归档 updater 签名: $($sig.Name)"
          } else {
            Write-Host "::warning::未生成 .sig，本次安装包无法用于应用内自动更新"
          }
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: out/*
          if-no-files-found: error

  windows-store:
    name: Windows MSIX x64
    if: startsWith(github.ref, 'refs/tags/v') || inputs.build_store
    runs-on: windows-latest
    timeout-minutes: 60
    # 商店包出问题不该拖死正式 Release
    continue-on-error: true
    env:
      VITE_APP_BASE_API: ${{ vars.VITE_APP_BASE_API }}
      VITE_OSS_URL: ${{ vars.VITE_OSS_URL }}
      VITE_OSS_THUMBNAIL_URL: ${{ vars.VITE_OSS_THUMBNAIL_URL }}
      VITE_OSS_1999_PREVIEW_URL: ${{ vars.VITE_OSS_1999_PREVIEW_URL }}
      VITE_STORE_VERSION: ${{ vars.VITE_STORE_VERSION }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          # 缓存 pnpm store，避免每个 job 从零装依赖
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: windows-msix-x64
          cache-on-failure: true

      - name: 安装依赖
        # 锁文件含 packages/app_server（私有子模块）的 importer，CI 无法检出，frozen 校验必然失败
        run: pnpm install --no-frozen-lockfile

      - name: 生成前端环境变量
        run: node scripts/writeCiEnv.js windows

      - name: 构建 MSIX 安装包
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File packages/app_tauri/scripts/build-microsoft-store.ps1 -Architectures x64

      - uses: actions/upload-artifact@v7
        with:
          name: windows-msix
          path: packages/app_tauri/target/microsoft-store/*.msixbundle
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: [android, windows, windows-store]
    # 安卓和 Windows 必须成功；MSIX 是可选产物，失败不应阻断发布
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.android.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # 需要历史 tag 才能算出「自上个版本以来的变更」
          fetch-depth: 0
          submodules: false

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 校验产物
        run: ls -l dist

      - name: 生成发布说明
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          prev="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          echo "上一个版本: ${prev:-无}"

          cat > notes.md <<'TPL'
          > 由 GitHub Actions 自动构建，产物未做代码签名，Windows 首次运行会提示 SmartScreen，选择「更多信息 → 仍要运行」即可。

          ## 下载

          | 平台 | 文件 | 适用 |
          | --- | --- | --- |
          | Windows x64 | `re1999-archive_VER_x64-setup.exe` | 64 位 Windows 10/11 |
          | Windows x64 | `re1999-archive_VER_x64-setup.exe.sig` | 安装包签名，供应用内更新校验 |
          | Android | `re1999-archive_VER_arm64-v8a.apk` | 绝大多数手机（arm64） |
          | Android | `re1999-archive_VER_x86_64.apk` | x86 模拟器、极少数设备 |

          ## 校验

          每个包都附有同名 `.md5` 文件，下载后可自行比对：

          ```bash
          md5sum -c re1999-archive_VER_x64-setup.exe.md5
          # Windows
          certutil -hashfile re1999-archive_VER_x64-setup.exe MD5
          ```

          安卓包已用正式证书签名，可直接覆盖安装旧版本；签名不一致时会报 `INSTALL_FAILED_UPDATE_INCOMPATIBLE`。

          ## 本次变更
          TPL
          sed -i "s/VER/${ver}/g" notes.md

          if [ -n "$prev" ]; then
            git log --no-merges --max-count=40 --pretty='- %s (%h)' "${prev}..${TAG}" >> notes.md
          else
            git log --no-merges --max-count=40 --pretty='- %s (%h)' "${TAG}" >> notes.md
          fi

          cat notes.md

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md \
            --verify-tag
